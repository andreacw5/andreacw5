<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" xml:space="preserve" role="img" aria-label="Terminal: Andrea Tombolato, full-stack developer in Milan">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 18px; }
    .p { fill: #3fb950; }
    .c { fill: #e6edf3; }
    .o { fill: #c9d1d9; }
    .d { fill: #8b949e; }
    .a { fill: #79c0ff; }
    .y { fill: #d29922; }
  </style>
  <defs>
    <clipPath id="t1"><rect x="0" y="0" width="0" height="330"><animate attributeName="width" from="40" to="900" begin="0.3s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="t2"><rect x="0" y="0" width="0" height="330"><animate attributeName="width" from="40" to="900" begin="1.5s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="t3"><rect x="0" y="0" width="0" height="330"><animate attributeName="width" from="40" to="900" begin="2.8s" dur="0.7s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M0.5 40 V10.5 a10 10 0 0 1 10 -10 H889.5 a10 10 0 0 1 10 10 V40 Z" fill="#161b22"/>
  <line x1="0.5" y1="40" x2="899.5" y2="40" stroke="#30363d"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="20" r="6" fill="#febc2e"/>
  <circle cx="62" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" class="d" style="font-size:14px">andrea@heyatom: ~</text>

  <g clip-path="url(#t1)"><text x="32" y="82"><tspan class="p">$ </tspan><tspan class="c">whoami</tspan></text></g>
  <text x="32" y="112" opacity="0"><set attributeName="opacity" to="1" begin="1s" fill="freeze"/><tspan class="c">Andrea Tombolato</tspan><tspan class="d"> · </tspan><tspan class="o">full-stack developer</tspan><tspan class="d"> · </tspan><tspan class="o">Milan, IT</tspan></text>

  <g clip-path="url(#t2)"><text x="32" y="156"><tspan class="p">$ </tspan><tspan class="c">cat ./day-job</tspan></text></g>
  <text x="32" y="186" opacity="0"><set attributeName="opacity" to="1" begin="2.3s" fill="freeze"/><tspan class="y">Meview</tspan><tspan class="d"> @ Medas · </tspan><tspan class="o">patient portal for Italian hospitals, since 2016</tspan></text>

  <g clip-path="url(#t3)"><text x="32" y="230"><tspan class="p">$ </tspan><tspan class="c">ls ~/after-hours</tspan></text></g>
  <text x="32" y="260" opacity="0"><set attributeName="opacity" to="1" begin="3.7s" fill="freeze"/><tspan class="a">dbd-builds  fileharbor  articuno  gatherly  ziplink</tspan></text>

  <text x="32" y="304" opacity="0"><set attributeName="opacity" to="1" begin="4.1s" fill="freeze"/><tspan class="p">$ </tspan><tspan class="c">▍<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="4.1s" repeatCount="indefinite"/></tspan></text>
</svg>
